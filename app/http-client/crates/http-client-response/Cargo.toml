[package]
name = "http-client-response"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
app-i18n.workspace = true
http-client-core.workspace = true
gpui-kit = { workspace = true, features = [
  "tree-sitter-languages",
] }
gpui-operation = { workspace = true, features = ["tracing"] }
gpui-tokio.workspace = true
fluent-bundle = "0.16.0"

url = "2.5.8"
http = "1.5.0"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
async-channel = "2.5.0"
bytes = "1.12.1"
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
futures-util = "0.3.34"
hayro = "0.7.1"
image = { version = "0.25.10", default-features = false, features = [
  "gif",
  "jpeg",
  "png",
  "webp",
] }
rodio = { version = "=0.22.2", default-features = false, features = [
  "playback",
  "symphonia-aac",
  "symphonia-flac",
  "symphonia-isomp4",
  "symphonia-mkv",
  "symphonia-mp3",
  "symphonia-ogg",
  "symphonia-pcm",
  "symphonia-vorbis",
  "symphonia-wav",
] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "time"] }

# log
tracing = "0.1.44"


[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
