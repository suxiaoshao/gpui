name: GStreamer Windows Discovery Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Windows GStreamer 1.28.6 inventory
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GSTREAMER_AUDIT_SOURCE_URL: https://gstreamer.freedesktop.org/data/pkg/windows/1.28.6/msvc/gstreamer-1.0-msvc-x86_64-1.28.6.exe
      GSTREAMER_AUDIT_SHA256: 059251444d1267b486eba390b18d25fed87e10315e72f757ec6c7e912fa746b5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official GStreamer runtime for discovery
        run: >-
          script/install-gstreamer-windows.ps1
          -SdkSourceUrl $env:GSTREAMER_AUDIT_SOURCE_URL
          -SdkSha256 $env:GSTREAMER_AUDIT_SHA256
        shell: pwsh

      - name: Collect runtime inventory
        id: collect
        continue-on-error: true
        run: |
          script/audit-gstreamer-windows.ps1 `
            -RuntimeRoot $env:GPUI_GSTREAMER_SDK_ROOT `
            -OutputDirectory target/gstreamer-audit/windows `
            -RequiredElement @(
              "playbin",
              "uridecodebin",
              "appsink",
              "audioconvert",
              "audioresample",
              "videoconvert",
              "videoscale",
              "autoaudiosink",
              "qtdemux",
              "avdec_h264",
              "avdec_aac",
              "matroskademux",
              "vp8dec",
              "vp9dec",
              "opusdec",
              "avdec_mp3",
              "wavparse",
              "flacparse",
              "flacdec",
              "oggdemux",
              "vorbisdec"
            )
        shell: pwsh

      - name: Upload Windows GStreamer audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gstreamer-1.28.6-inventory
          path: target/gstreamer-audit/windows
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when collection is incomplete
        if: steps.collect.outcome == 'failure'
        run: exit 1
        shell: pwsh
