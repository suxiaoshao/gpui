name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether build checks are needed
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Unknown comparisons and manual runs retain the full checks.
          echo 'run=true' >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            exit 0
          fi
          if [[ "$EVENT" == pull_request ]]; then
            BASE=$(git merge-base "$BASE" "$HEAD")
          fi
          git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files"
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|README.zh-CN.md|AGENTS.md|CLAUDE.md|docs/*.md|.agents/skills/*.md|.claude/skills) ;;
              *) exit 0 ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo 'run=false' >> "$GITHUB_OUTPUT"
          echo 'Documentation-only changes: skipping build and test steps.' >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: changes
    # Instantiate all required matrix checks, including documentation-only runs.
    # If classification fails, keep running the existing checks.
    if: ${{ !cancelled() }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs_on: macos-latest
            command: nix develop --command
            timeout_minutes: 60
          - name: Linux
            runs_on: ubuntu-latest
            command: nix develop --command
            timeout_minutes: 60
          - name: Windows
            runs_on: windows-latest
            command: ""
            timeout_minutes: 90

    steps:
      - name: Documentation-only changes
        if: ${{ needs.changes.outputs.run == 'false' }}
        shell: bash
        run: echo 'Documentation-only changes; build and test steps are not required.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: ${{ needs.changes.outputs.run != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure Xcode Metal compiler
        if: ${{ needs.changes.outputs.run != 'false' && runner.os == 'macOS' }}
        run: |
          if ! /usr/bin/xcrun metal --version; then
            /usr/bin/xcodebuild -downloadComponent MetalToolchain
          fi
          /usr/bin/xcrun metal --version

      - name: Install Nix
        if: ${{ needs.changes.outputs.run != 'false' && runner.os != 'Windows' }}
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      - name: Install pinned Rust on Windows
        if: ${{ needs.changes.outputs.run != 'false' && runner.os == 'Windows' }}
        run: rustup toolchain install --no-self-update

      - name: Prepare Nix toolchain for the Cargo cache
        if: ${{ needs.changes.outputs.run != 'false' && runner.os != 'Windows' }}
        run: nix develop --command bash -c 'dirname "$(command -v rustc)" >> "$GITHUB_PATH"'

      - name: Cache cargo artifacts
        if: ${{ needs.changes.outputs.run != 'false' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}
          cache-bin: false
          cache-targets: ${{ matrix.runs_on != 'windows-latest' }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Cargo fmt
        if: ${{ needs.changes.outputs.run != 'false' }}
        run: ${{ matrix.command }} cargo fmt --all -- --check

      - name: Cargo build
        if: ${{ needs.changes.outputs.run != 'false' }}
        run: ${{ matrix.command }} cargo build --workspace --locked

      - name: Cargo test
        if: ${{ needs.changes.outputs.run != 'false' }}
        run: ${{ matrix.command }} cargo test --workspace --locked

      - name: Cargo clippy
        if: ${{ needs.changes.outputs.run != 'false' && matrix.runs_on == 'macos-latest' }}
        run: ${{ matrix.command }} cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
