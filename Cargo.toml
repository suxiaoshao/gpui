[workspace]
members = [
  "app/jaco",
  "app/gupi",
  "app/feiwen",
  "app/http-client",
  "app/novel-download",
  "crates/app-assets",
  "crates/app-assets-macros",
  "crates/app-theme",
  "crates/jaco-agent",
  "crates/jaco-conversation",
  "crates/jaco-core",
  "crates/jaco-db",
  "crates/gpui-form",
  "crates/gpui-form-gpui-component",
  "crates/gpui-form-macros",
  "crates/gpui-heatmap",
  "crates/gpui-operation",
  "crates/gpui-store",
  "crates/gpui-tokio",
  "crates/http-client-test-server",
  "crates/platform-ext",
  "crates/pi-rpc",
  "crates/window-ext",
  "crates/xtask",
]

resolver = "2"

[workspace.dependencies]
# GPUI runtime and component versions are kept together.
gpui = { package = "gpui-pre", version = "=0.3.3" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.3", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
] }
gpui-kit = "=0.6.0"
gpui-component = "=0.6.0"
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.6.0" }

# Shared workspace crates.
app-assets = { path = "./crates/app-assets" }
app-theme = { path = "./crates/app-theme", default-features = false }
gpui-form = { path = "./crates/gpui-form", features = ["garde-adapter"] }
gpui-form-gpui-component = { path = "./crates/gpui-form-gpui-component" }
gpui-form-macros = { path = "./crates/gpui-form-macros" }
gpui-heatmap = { path = "./crates/gpui-heatmap" }
gpui-operation = { path = "./crates/gpui-operation" }
gpui-store = { path = "./crates/gpui-store" }
gpui-tokio = { path = "./crates/gpui-tokio" }
jaco-agent = { path = "./crates/jaco-agent" }
jaco-conversation = { path = "./crates/jaco-conversation" }
jaco-core = { path = "./crates/jaco-core" }
jaco-db = { path = "./crates/jaco-db" }
pi-rpc = { path = "./crates/pi-rpc" }
platform-ext = { path = "./crates/platform-ext" }
window-ext = { path = "./crates/window-ext" }

# Shared validation and agent integrations.
garde = { version = "0.23.0", default-features = false, features = [
  "derive",
  "url",
  "email",
  "pattern",
] }
rig = { version = "0.42.0", default-features = false, features = [
  "agent",
  "reqwest",
  "rmcp",
  "rustls",
  "websocket",
] }
rmcp = { version = "2.2.0", features = [
  "auth",
  "client",
  "macros",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = true

[profile.dev.package]
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.release.package]
jaco = { codegen-units = 16 }

[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16
