[workspace]
members = [
  "app/jaco",
  "app/feiwen",
  "app/http-client",
  "app/novel-download",
  "app/lestty",
  "crates/app-assets",
  "crates/app-assets-macros",
  "crates/app-theme",
  "crates/jaco-agent",
  "crates/jaco-conversation",
  "crates/jaco-core",
  "crates/jaco-db",
  "crates/gpui-form",
  "crates/gpui-form-gpui-component",
  "crates/gpui-form-macros",
  "crates/gpui-operation",
  "crates/gpui-store",
  "crates/http-client-test-server",
  "crates/platform-ext",
  "crates/window-ext",
  "crates/xtask",
]

resolver = "2"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", version = "=0.1.0", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-base = { git = "https://github.com/longbridge/gpui-component", version = "=0.5.2" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", version = "=0.5.2" }
# Optional, for default bundled assets
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", version = "=0.5.1", package = "gpui-component-assets" }
jaco-core = { path = "./crates/jaco-core" }
jaco-db = { path = "./crates/jaco-db" }
jaco-agent = { path = "./crates/jaco-agent" }
jaco-conversation = { path = "./crates/jaco-conversation" }
app-assets = { path = "./crates/app-assets" }
app-theme = { path = "./crates/app-theme", default-features = false }
gpui-form = { path = "./crates/gpui-form", features = ["garde-adapter"] }
gpui-form-gpui-component = { path = "./crates/gpui-form-gpui-component" }
gpui-form-macros = { path = "./crates/gpui-form-macros" }
gpui-operation = { path = "./crates/gpui-operation" }
gpui-store = { path = "./crates/gpui-store" }
gpui-tokio = { git = "https://github.com/zed-industries/zed", version = "=0.1.0", package = "gpui_tokio" }
garde = { version = "0.23.0", default-features = false, features = ["derive", "url", "email", "pattern"] }
window-ext = { path = "./crates/window-ext" }
platform-ext = { path = "./crates/platform-ext" }
rig = { version = "0.42.0", default-features = false, features = [
  "agent",
  "reqwest",
  "rmcp",
  "rustls",
  "websocket",
] }
rmcp = { version = "=2.2.0", features = [
  "auth",
  "client",
  "macros",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", version = "=0.2.2" }
gpui-macros = { git = "https://github.com/zed-industries/zed", version = "=0.1.0", package = "gpui_macros" }
# arrayref 0.3.10, published on 2026-08-20, introduced a malicious build dependency.
arrayref = { git = "https://github.com/droundy/arrayref", rev = "f8d0299d863922db6c409d08098941e833b70d69", version = "=0.3.9" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = true

[profile.dev.package]
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.release.package]
jaco = { codegen-units = 16 }

[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16
