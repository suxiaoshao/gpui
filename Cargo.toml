[workspace]
members = [
  "app/feiwen",
  "app/feiwen/crates/feiwen-data",
  "app/feiwen/crates/feiwen-fetch",
  "app/feiwen/crates/feiwen-query",
  "app/http-client",
  "app/http-client/crates/http-client-core",
  "app/http-client/crates/http-client-request",
  "app/http-client/crates/http-client-response",
  "app/novel-download",
  "app/novel-download/crates/novel-download-feature",
  "crates/app-theme",
  "crates/app-i18n",
  "crates/gpui-form",
  "crates/gpui-form-gpui-component",
  "crates/gpui-form-macros",
  "crates/gpui-heatmap",
  "crates/gpui-lucide",
  "crates/gpui-operation",
  "crates/gpui-store",
  "crates/gpui-tokio",
  "crates/http-client-test-server",
  "crates/platform-ext",
  "crates/xtask",
]

resolver = "2"

[workspace.metadata.cargo-shear]
# gpui-lucide/build.rs consumes the upstream icons-dir build metadata.
ignored = ["gpui-component-assets"]

[workspace.dependencies]
# GPUI runtime and component versions are kept together.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-kit = "=0.7.0"
gpui-component = "=0.7.0"
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.7.0" }

# Application capabilities.
novel-download-feature = { path = "./app/novel-download/crates/novel-download-feature" }
http-client-core = { path = "./app/http-client/crates/http-client-core" }
http-client-request = { path = "./app/http-client/crates/http-client-request" }
http-client-response = { path = "./app/http-client/crates/http-client-response" }

feiwen-data = { path = "./app/feiwen/crates/feiwen-data" }
feiwen-fetch = { path = "./app/feiwen/crates/feiwen-fetch" }
feiwen-query = { path = "./app/feiwen/crates/feiwen-query" }

# Shared workspace crates.
app-i18n = { path = "./crates/app-i18n" }
app-theme = { path = "./crates/app-theme", default-features = false }
gpui-form = { path = "./crates/gpui-form", features = ["garde-adapter"] }
gpui-form-gpui-component = { path = "./crates/gpui-form-gpui-component" }
gpui-form-macros = { path = "./crates/gpui-form-macros" }
gpui-lucide = { path = "./crates/gpui-lucide" }
gpui-operation = { path = "./crates/gpui-operation" }
gpui-store = { path = "./crates/gpui-store" }
gpui-tokio = { path = "./crates/gpui-tokio" }
platform-ext = { path = "./crates/platform-ext" }

# Shared validation.
garde = { version = "0.23.0", default-features = false, features = [
  "derive",
  "url",
  "email",
  "pattern",
] }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = true

[profile.dev.package]
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16
