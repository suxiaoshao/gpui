[package]
name = "gpui-form"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-shear]
# Compiled by the trybuild harness in tests/ui.rs.
ignored-paths = ["tests/ui/vnext/pass/*.rs", "tests/ui/vnext/fail/*.rs"]

[features]
default = []
garde-adapter = ["dep:garde"]

[dependencies]
garde = { workspace = true, optional = true }
gpui = { workspace = true }
gpui-form-macros = { workspace = true }
gpui-operation = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
trybuild = "1.0.121"
