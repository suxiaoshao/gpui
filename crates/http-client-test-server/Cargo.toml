[package]
name = "http-client-test-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-compression = { version = "0.4.43", default-features = false, features = ["tokio", "brotli", "gzip", "zlib", "zstd"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1.12.1"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server-graceful", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
