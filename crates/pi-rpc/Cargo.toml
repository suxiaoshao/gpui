[package]
name = "pi-rpc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Single-process Pi CLI RPC client"

[package.metadata.cargo-shear]
# Embedded with include_str! and compiled by tests/support/mod.rs.
ignored-paths = ["tests/fixtures/process.rs"]

[dependencies]
tokio = { version = "1.53.1", features = ["rt", "process", "io-util", "time", "macros", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
thiserror = "2.0.21"
which = "8.0.6"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "test-util"] }
tempfile = "3.27.0"
