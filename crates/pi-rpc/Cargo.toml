[package]
name = "pi-rpc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Single-process Pi CLI RPC client"

[dependencies]
tokio = { version = "1.53.1", features = ["rt", "process", "io-util", "time", "macros", "sync"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
which = "8.0.2"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "test-util"] }
tempfile = "3.27.0"
